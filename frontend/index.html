<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Log Analyzer</title>
    <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/assets/styles.css?v=3" />
  </head>
  <body>
    <aside class="sidebar">
      <div class="brand"><div class="brand-mark">L</div><div><strong>Log Analyzer</strong><small>內網監控中心</small></div></div>
      <div class="nav-label">WORKSPACE</div>
      <nav>
        <button class="nav-item active" data-view="dashboard"><span>◈</span>總覽</button>
        <button class="nav-item" data-view="sources"><span>⌁</span>Log 來源</button>
        <button class="nav-item" data-view="summaries"><span>✦</span>分析結果</button>
      </nav>
      <div class="nav-label settings-label">SETTINGS</div>
      <nav>
        <button class="nav-item" data-view="llm"><span>◎</span>LLM 設定</button>
        <button class="nav-item" data-view="webhook"><span>↗</span>Webhook</button>
      </nav>
      <div class="sidebar-footer"><span class="pulse"></span><span>服務運行中</span><code>v0.1.0</code></div>
    </aside>
    <main class="app">
      <header class="topbar"><div><span class="eyebrow">LOG OBSERVABILITY</span><h1 id="view-title">總覽</h1></div><div class="topbar-status"><span id="health-dot" class="pulse"></span><span id="health">檢查中...</span></div></header>
      <section id="content"></section>
    </main>
    <script src="/assets/app.js?v=3"></script>
  </body>
</html>
